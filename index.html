<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- タイトルと説明は js/content.js の名前・日付から自動で入る -->
<title>体育祭しおり</title>
<meta name="description" content="体育祭のしおり。施設案内・タイムテーブル・競技説明など。">
<!-- LINEやSNSで共有した時のプレビュー(OGP)。JSは動かないので、ここに直接書く
     体育祭の名前が決まったら og:title も書き換える(README の「共有時のプレビュー」) -->
<meta property="og:title" content="SPORTS DAY 2026 しおり">
<meta property="og:description" content="11月27日(金) 体育祭のしおり。タイムテーブル・競技説明・施設案内など">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kuro-83.github.io/sports-festival-2026/">
<meta property="og:image" content="https://kuro-83.github.io/sports-festival-2026/img/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<!-- ブラウザのタブ・ホーム画面のアイコン -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@800;900&family=Oswald:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- しおりの中身は js/content.js に書く。このファイルは「枠」だけ -->

<!-- ?check を付けた時だけ、未入力の一覧がここに出る -->
<div id="check" hidden></div>

<!-- 上に固定するヘッダー -->
<div class="topbar">
  <div class="topbar__inner wrap">
    <span class="topbar__brand" id="site-brand"></span>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu" aria-label="メニューを開く">
      <svg class="menu-btn__open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
      <svg class="menu-btn__close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
    </button>
  </div>
</div>

<!-- ハンバーガーで開くメニュー。項目は目次と同じものを js/main.js が入れる -->
<nav class="menu" id="menu" aria-label="メニュー" hidden>
  <div class="wrap">
    <p class="eyebrow">MENU</p>
    <div class="menu__list" id="menu-list"></div>
  </div>
</nav>

<header id="top" class="cover">
  <div class="cover__body wrap">
    <div class="cover__text">
      <div class="cover__date">
        <span class="cover__day" id="site-day"></span>
        <span class="cover__weekday" id="site-weekday"></span>
      </div>
      <h1 class="cover__title" id="site-name"></h1>
      <p class="cover__slogan" id="site-slogan"></p>
      <p class="cover__venue" id="site-venue"></p>
    </div>
    <!-- .frame = イラストの枠。隠れキャラはこの中で、枠(.ph)の後ろに入る -->
    <div class="frame cover__illust" id="frame-cover">
      <div class="ph" id="cover-image">表紙イラスト</div>
    </div>
  </div>
  <div class="track-stripe" aria-hidden="true"></div>
</header>

<main class="wrap">

  <!-- 番号(01〜)は、表示されているセクションだけで自動で振られる
       見出しの大きい番号(.section__num)も隠れキャラの枠。キャラは数字(.section__digits)の後ろに入る -->
  <nav id="toc" class="toc" aria-label="目次">
    <p class="eyebrow">CONTENTS</p>
    <div class="toc__list">
      <a href="#map"><span class="num"></span>施設案内</a>
      <a href="#timetable"><span class="num"></span>タイムテーブル</a>
      <a href="#events"><span class="num"></span>競技説明＆見どころ</a>
      <a href="#others"><span class="num"></span>ほかの企画</a>
      <a href="#fun"><span class="num"></span>おたのしみ</a>
      <a href="#notice"><span class="num"></span>注意事項</a>
    </div>
  </nav>

  <!-- 施設案内 -->
  <section id="map" class="section">
    <div class="section__head">
      <span class="section__num frame frame--num"><span class="section__digits"></span></span>
      <h2>施設案内</h2>
    </div>
    <div class="frame ph--map" id="frame-map">
      <div class="ph" id="map-image">簡易マップ</div>
    </div>
    <div class="places" id="places-list"></div>
  </section>

  <!-- タイムテーブル -->
  <section id="timetable" class="section">
    <div class="section__head">
      <span class="section__num frame frame--num"><span class="section__digits"></span></span>
      <h2>タイムテーブル</h2>
    </div>

    <div class="now">
      <div class="now__head">
        <span class="eyebrow eyebrow--flat">NOW RUNNING</span>
        <span class="now__label" id="now-label" aria-live="polite">読み込み中…</span>
      </div>
      <div class="track">
        <div class="track__lane" aria-hidden="true"></div>
        <svg class="track__goal" viewBox="0 0 20 28" aria-hidden="true">
          <rect x="1" y="0" width="1.5" height="28" fill="currentColor"></rect>
          <rect x="2.5" y="1" width="16" height="12" fill="#fff" stroke="currentColor" stroke-width="1"></rect>
          <path d="M2.5 1h4v4h-4zM10.5 1h4v4h-4zM6.5 5h4v4h-4zM14.5 5h4v4h-4zM2.5 9h4v4h-4zM10.5 9h4v4h-4z" fill="currentColor"></path>
        </svg>
        <div class="track__runner" id="runner" aria-hidden="true">キャラ</div>
      </div>
      <div class="track__ends"><span>START</span><span>GOAL</span></div>
    </div>
    <p class="note" id="now-note">※時刻・プログラムは仮。当日は実際の時刻で自動的に動く</p>

    <ol class="program" id="program"></ol>
  </section>

  <!-- 競技説明＆見どころ -->
  <section id="events" class="section">
    <div class="section__head">
      <span class="section__num frame frame--num"><span class="section__digits"></span></span>
      <h2>競技説明＆見どころ</h2>
    </div>
    <div class="events" id="events-list"></div>
  </section>

  <!-- ほかの企画 -->
  <section id="others" class="section">
    <div class="section__head">
      <span class="section__num frame frame--num"><span class="section__digits"></span></span>
      <h2>ほかの企画</h2>
    </div>
    <div class="others" id="others-list"></div>
  </section>

  <!-- おたのしみ -->
  <section id="fun" class="section">
    <div class="section__head">
      <span class="section__num frame frame--num"><span class="section__digits"></span></span>
      <h2>おたのしみ</h2>
    </div>
    <div class="fun">
      <!-- 隠れキャラ探し(hiddenChars が空なら出ない) -->
      <div class="fun__item" id="hunt" hidden>
        <h3>隠れキャラ探し</h3>
        <p id="hunt-text"></p>
        <p class="hunt__progress">
          <span class="visually-hidden">見つけた数</span>
          <span class="hunt__dots" id="hunt-dots" aria-hidden="true"></span>
          <span class="hunt__count" id="hunt-count" aria-live="polite"></span>
        </p>
        <p class="hunt__done" id="hunt-done" hidden></p>
      </div>
      <!-- 間違い探しの答え(説明も画像も空なら出ない) -->
      <div class="fun__item" id="spot">
        <h3>間違い探し</h3>
        <p id="spot-text"></p>
        <button type="button" class="btn-sub" id="spot-btn" aria-expanded="false" aria-controls="spot-answer">答えを見る</button>
        <div class="ph ph--answer" id="spot-answer" hidden>答えの画像</div>
      </div>
    </div>
  </section>

  <!-- 注意事項 -->
  <section id="notice" class="section">
    <div class="section__head">
      <span class="section__num frame frame--num"><span class="section__digits"></span></span>
      <h2>注意事項</h2>
    </div>
    <div class="notices" id="notices-list"></div>
  </section>

</main>

<footer class="footer">
  <div class="track-stripe" aria-hidden="true"></div>
  <div class="footer__inner wrap">
    <span id="footer-name"></span>
    <a href="#top">ページの先頭へ</a>
  </div>
</footer>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
